                background: inherit;
                border: 0;

                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #8a3b2a;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #8a3b2a;
                filter: brightness(92%);

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #f6f1e8;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {

                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);

            @media screen and (-webkit-min-device-pixel-ratio: 0) {

                input[type="text"] {
                    font-size: 16px;
                }
            }

                // style.css / quiz.js が一度も使われない。ここで土台だけを、このフォークの
                // 土台に置き換える。ファイルの木は元と同じなので、読めるもの・読めないものは
                // 元から変わらない。診断API（kankou-concierge-test.com/wp-json/）は触らない。
                replaceHtmlCallback: function (plainHTML) {
                    var base = "/" + location.pathname.split("/")[1];
                    var fixed = plainHTML
                        .split("https://takumin-2525.github.io/editplus-kyoto-mock").join(base);

                    // この書き出しは古く、写真が無いカードが <div class="noimg">No Image</div>
                    // のまま。テーマ側は同じ面にその場所の名前を組むように直してあるので、
                    // デモでも同じ見え方になるよう、同じカード内の見出しを面に移す。
                    fixed = fixed.replace(/<article class="spot">[\s\S]*?<\/article>/g, function (block) {
                        if (block.indexOf('class="noimg"') < 0) { return block; }
                        var m = block.match(/<h[34]>\s*<a[^>]*>([\s\S]*?)<\/a>/);
                        var name = m ? m[1].trim() : "";
                        // 面が見出しになるので、下の同じ名前は読み上げ用に隠す
                        block = block.replace(/<h([34])>(\s*<a)/, '<h$1 class="screen-reader-text">$2');
                        return block.replace(/<div class="noimg">[\s\S]*?<\/div>/,
                            '<div class="noimg"><span class="noimg-name">' + name + "</span></div>");
                    });

                    document.write(fixed);
                    document.close();
                },
                clearLocalStorageCallback: null,
            };

            // init the staticrypt engine
            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

                // replaced, no need to do anything

                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();
